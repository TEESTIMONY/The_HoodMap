<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HoodMap — Phase 2 test console</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #2f81f7; --green: #3fb950; --red: #f85149; --amber: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--green); } .dot.bad { background: var(--red); }
  main { max-width: 1120px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
  .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .panel > h2 {
    margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 600;
    border-bottom: 1px solid var(--border); color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
  }
  .body { padding: 16px; display: grid; gap: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input {
    flex: 1; min-width: 240px; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--accent); color: #fff; font: inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--text); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
  .note { color: var(--muted); font-size: 12px; }
  .err { color: var(--red); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.mut { color: var(--muted); }
  tr.clk { cursor: pointer; }
  tr.clk:hover td { background: #1c2230; }
  .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; max-height: 460px; overflow-y: auto; }
  .tag { padding: 1px 6px; border-radius: 4px; font-size: 11px; border: 1px solid var(--border); }
  .tag.buy { color: var(--green); border-color: var(--green); }
  .tag.sell { color: var(--red); border-color: var(--red); }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 18px; font-weight: 600; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>HoodMap · Phase 2 test console</h1>
  <span class="pill"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></span>
  <span class="pill">chain <span id="chainId">—</span></span>
  <span class="pill">block <span id="indexedBlock">—</span></span>
  <span class="pill">WETH <span id="wethPill">—</span></span>
</header>

<main>
  <section class="panel">
    <h2>Market — Robinhood Chain</h2>
    <div class="body">
      <div class="stats" id="marketStats"><span class="note">loading…</span></div>
    </div>
  </section>

  <section class="panel">
    <h2>Tokens <span class="note">— by 24h volume (inline aggregate; precomputed in 2b)</span></h2>
    <div class="body"><div id="tokensWrap"><span class="note">loading…</span></div></div>
  </section>

  <section class="panel">
    <h2>Pairs / Pools</h2>
    <div class="body">
      <div id="pairsWrap"><span class="note">loading…</span></div>
      <div id="pairDetail"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Recent swaps <span class="note">— live decoded feed</span></h2>
    <div class="body"><div id="swapsWrap"><span class="note">loading…</span></div></div>
  </section>

  <section class="panel">
    <h2>Wallet</h2>
    <div class="body">
      <div class="row">
        <input id="walletInput" placeholder="0x wallet address" spellcheck="false" />
        <button id="walletBtn">Look up</button>
      </div>
      <div id="walletSummary"></div>
      <div id="walletTxWrap"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Token lookup</h2>
    <div class="body">
      <div class="row">
        <input id="tokenInput" placeholder="0x token contract address" spellcheck="false" />
        <button id="tokenBtn">Look up</button>
      </div>
      <div id="tokenResult"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const explorerBase = "https://robinhoodchain.blockscout.com";

async function api(path) {
  try {
    const res = await fetch(path);
    const text = await res.text();
    let json;
    try { json = text ? JSON.parse(text) : null; } catch { json = { error: text }; }
    return { ok: res.ok, status: res.status, json };
  } catch (e) {
    return { ok: false, status: 0, json: { error: String(e) } };
  }
}

function esc(s) { return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function short(a) { return a ? a.slice(0, 6) + "…" + a.slice(-4) : "—"; }
function ts(t) { return t ? new Date(t).toISOString().replace("T", " ").slice(0, 19) : "—"; }
function usd(v) {
  if (v == null) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  if (n === 0) return "$0";
  if (n < 0.01) return "<$0.01";
  return "$" + n.toLocaleString(undefined, { maximumFractionDigits: n < 1000 ? 2 : 0 });
}
function price(v) {
  if (v == null) return "—";
  const n = Number(v);
  if (!isFinite(n) || n <= 0) return "—";
  if (n >= 1) return "$" + n.toLocaleString(undefined, { maximumFractionDigits: 4 });
  return "$" + n.toPrecision(4);
}
function amt(raw, decimals) {
  if (raw == null) return "—";
  try {
    const d = BigInt(decimals ?? 18);
    const s = BigInt(raw).toString().padStart(Number(d) + 1, "0");
    const cut = s.length - Number(d);
    const whole = s.slice(0, cut).replace(/^0+(?=\d)/, "");
    const frac = s.slice(cut).replace(/0+$/, "").slice(0, 4);
    return frac ? `${whole}.${frac}` : whole;
  } catch { return "—"; }
}
const txLink = (h) => `<a href="${explorerBase}/tx/${h}" target="_blank">${short(h)}</a>`;
const addrLink = (a) => `<a href="${explorerBase}/address/${a}" target="_blank">${short(a)}</a>`;

/* ---- health ---- */
async function pollHealth() {
  const dot = $("statusDot"), txt = $("statusText");
  const { json } = await api("/health");
  if (json && json.status) {
    $("chainId").textContent = json.chainId ?? "—";
    if (json.db === false) {
      dot.className = "dot bad"; txt.textContent = "API up · DB unreachable";
      $("indexedBlock").textContent = "—";
    } else {
      dot.className = "dot ok"; txt.textContent = json.status;
      $("indexedBlock").textContent = json.indexedThroughBlock ?? "—";
    }
  } else {
    dot.className = "dot bad"; txt.textContent = "API unreachable";
  }
}

/* ---- market ---- */
async function loadMarket() {
  const { ok, json } = await api("/api/v1/stats");
  if (!ok) { $("marketStats").innerHTML = `<span class="err">${esc(json?.error)}</span>`; return; }
  $("marketStats").innerHTML = [
    ["tokens", Number(json.tokens).toLocaleString()], ["pools", Number(json.pools).toLocaleString()],
    ["liquidity", usd(json.liquidity_usd)], ["volume 24h", usd(json.volume_24h)],
    ["swaps 24h", json.swaps_24h], ["active wallets 24h", json.active_wallets_24h],
  ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${k}</span></div>`).join("");
  $("wethPill").textContent = json.weth_usd ? price(json.weth_usd) : "—";
}

// Low-confidence prices come from thin pools — show them muted with a ~.
function confPrice(v, conf) {
  if (v == null) return "—";
  const s = price(v);
  return conf === "low" ? `<span class="mut" title="low confidence — thin liquidity">~${s}</span>` : s;
}

/* ---- tokens ---- */
async function loadTokens() {
  const { ok, json } = await api("/api/v1/tokens?limit=100");
  if (!ok) { $("tokensWrap").innerHTML = `<span class="err">${esc(json?.error)}</span>`; return; }
  if (!json.tokens.length) { $("tokensWrap").innerHTML = `<span class="note">no priced tokens yet — the stats worker runs every ~45s</span>`; return; }
  const rows = json.tokens.map((t) => `<tr>
    <td>${esc(t.symbol || "?")}</td>
    <td class="mut">${esc((t.name || "").slice(0, 28))}</td>
    <td class="num">${confPrice(t.price, t.price_confidence)}</td>
    <td class="num mut">${t.price_native ? Number(t.price_native).toPrecision(3) + " Ξ" : "—"}</td>
    <td class="num">${usd(t.liquidity_usd)}</td>
    <td class="num">${usd(t.fdv)}</td>
    <td class="num">${usd(t.volume_24h)}</td>
    <td class="num mut">${esc(t.buy_count_24h ?? 0)}/${esc(t.sell_count_24h ?? 0)}</td>
    <td class="num mut">${esc(t.pool_count ?? 0)}</td>
    <td>${addrLink(t.address)}</td>
  </tr>`).join("");
  $("tokensWrap").innerHTML = `<div class="scroll"><table>
    <thead><tr><th>sym</th><th>name</th><th class="num">price</th><th class="num">price Ξ</th><th class="num">liquidity</th><th class="num">FDV</th><th class="num">vol 24h</th><th class="num">b/s</th><th class="num">pools</th><th>addr</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="note">FDV = price × total supply. Market cap shown = FDV (no circulating-supply feed yet).</div>`;
}

/* ---- pairs ---- */
async function loadPairs() {
  const { ok, json } = await api("/api/v1/pairs?limit=100");
  if (!ok) { $("pairsWrap").innerHTML = `<span class="err">${esc(json?.error)}</span>`; return; }
  if (!json.pairs.length) { $("pairsWrap").innerHTML = `<span class="note">no priced pools yet — the stats worker runs every ~45s</span>`; return; }
  const rows = json.pairs.map((p) => `<tr class="clk" data-pair="${p.address}">
    <td>${esc(p.symbol0 || "?")}/${esc(p.symbol1 || "?")}</td>
    <td class="mut">${esc(p.dex)}</td>
    <td class="mut">${p.fee_tier ? (Number(p.fee_tier) / 10000) + "%" : "—"}</td>
    <td class="num">${usd(p.liquidity_usd)}</td>
    <td class="num">${usd(p.volume_24h)}</td>
    <td class="num mut">${esc(p.buy_count_24h ?? 0)}/${esc(p.sell_count_24h ?? 0)}</td>
    <td>${addrLink(p.address)}</td>
  </tr>`).join("");
  $("pairsWrap").innerHTML = `<div class="scroll"><table>
    <thead><tr><th>pair</th><th>dex</th><th>fee</th><th class="num">liquidity</th><th class="num">vol 24h</th><th class="num">b/s</th><th>addr</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  $("pairsWrap").querySelectorAll("tr.clk").forEach((tr) => {
    tr.onclick = () => loadPairDetail(tr.dataset.pair);
  });
}

async function loadPairDetail(address) {
  $("pairDetail").innerHTML = `<span class="note">loading ${short(address)}…</span>`;
  const [meta, swaps] = await Promise.all([
    api(`/api/v1/pairs/${address}`),
    api(`/api/v1/pairs/${address}/swaps?limit=40`),
  ]);
  if (!meta.ok) { $("pairDetail").innerHTML = `<span class="err">${esc(meta.json?.error)}</span>`; return; }
  const m = meta.json;
  const head = `<dl class="kv">
    <dt>pair</dt><dd>${esc(m.symbol0)}/${esc(m.symbol1)} · ${esc(m.dex)} · ${m.fee_tier ? (Number(m.fee_tier)/10000)+"%" : "—"}</dd>
    <dt>pool</dt><dd>${addrLink(m.address)}</dd>
    <dt>${esc(m.symbol0)} price</dt><dd>${price(m.price0_usd)} &nbsp; (${m.price0_in_1 ? Number(m.price0_in_1).toPrecision(5) : "—"} ${esc(m.symbol1)})</dd>
    <dt>liquidity</dt><dd>${usd(m.liquidity_usd)}</dd>
    <dt>24h volume</dt><dd>${usd(m.volume_24h)}</dd>
    <dt>24h swaps</dt><dd>${esc(m.swap_count_24h ?? 0)} (${esc(m.buys_24h ?? 0)} buy / ${esc(m.sells_24h ?? 0)} sell)</dd>
  </dl>`;
  const rows = (swaps.json?.swaps || []).map((s) => swapRow(s, m.token0)).join("");
  $("pairDetail").innerHTML = head + (rows
    ? `<div class="scroll"><table><thead><tr><th>time</th><th>side</th><th>in</th><th>out</th><th class="num">USD</th><th>wallet</th><th>tx</th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<span class="note">no swaps recorded for this pool yet</span>`);
}

function swapRow(s, token0) {
  const isBuy = token0 && s.token_out.toLowerCase() === token0.toLowerCase();
  return `<tr>
    <td class="mut">${ts(s.timestamp)}</td>
    <td><span class="tag ${isBuy ? "buy" : "sell"}">${isBuy ? "BUY" : "SELL"}</span></td>
    <td>${amt(s.amount_in, s.decimals_in)} ${esc(s.symbol_in || "?")}</td>
    <td>${amt(s.amount_out, s.decimals_out)} ${esc(s.symbol_out || "?")}</td>
    <td class="num">${usd(s.usd_value)}</td>
    <td>${addrLink(s.wallet_address)}</td>
    <td>${txLink(s.transaction_hash)}</td>
  </tr>`;
}

/* ---- recent swaps ---- */
async function loadSwaps() {
  const { ok, json } = await api("/api/v1/swaps/recent?limit=60");
  if (!ok) { $("swapsWrap").innerHTML = `<span class="err">${esc(json?.error)}</span>`; return; }
  if (!json.swaps.length) { $("swapsWrap").innerHTML = `<span class="note">no swaps decoded yet</span>`; return; }
  const rows = json.swaps.map((s) => `<tr>
    <td class="mut">${ts(s.timestamp)}</td>
    <td class="mut">${esc(s.dex)}</td>
    <td>${amt(s.amount_in, s.decimals_in)} ${esc(s.symbol_in || "?")} → ${amt(s.amount_out, s.decimals_out)} ${esc(s.symbol_out || "?")}</td>
    <td class="num">${usd(s.usd_value)}</td>
    <td>${addrLink(s.wallet_address)}</td>
    <td>${txLink(s.transaction_hash)}</td>
  </tr>`).join("");
  $("swapsWrap").innerHTML = `<div class="scroll"><table>
    <thead><tr><th>time</th><th>dex</th><th>trade</th><th class="num">USD</th><th>wallet</th><th>tx</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---- wallet ---- */
let walletTxs = [], walletAddr = null;
async function lookupWallet() {
  const addr = $("walletInput").value.trim().toLowerCase();
  if (!/^0x[0-9a-f]{40}$/.test(addr)) {
    $("walletSummary").innerHTML = `<div class="err">Not a valid 0x address.</div>`;
    $("walletTxWrap").innerHTML = ""; return;
  }
  walletAddr = addr; walletTxs = [];
  $("walletBtn").disabled = true;
  $("walletSummary").innerHTML = `<div class="note">loading…</div>`;
  $("walletTxWrap").innerHTML = "";
  const summary = await api(`/api/v1/wallets/${addr}`);
  if (summary.ok) {
    const r = summary.json;
    $("walletSummary").innerHTML = `<dl class="kv">
      <dt>realized pnl</dt><dd>${esc(r.realized_pnl ?? "—")}</dd>
      <dt>unrealized pnl</dt><dd>${esc(r.unrealized_pnl ?? "—")}</dd>
      <dt>trades</dt><dd>${esc(r.total_trades ?? "—")}</dd>
      <dt>win rate</dt><dd>${esc(r.win_rate ?? "—")}</dd>
    </dl>`;
  } else if (summary.status === 404) {
    $("walletSummary").innerHTML = `<div class="note">No analytics summary yet — <code>${esc(summary.json?.error)}</code>. Wallet PnL is Phase 3; raw transactions below still work.</div>`;
  } else {
    $("walletSummary").innerHTML = `<div class="err">${esc(summary.json?.error || summary.status)}</div>`;
  }
  await loadMoreTxs();
  $("walletBtn").disabled = false;
}
async function loadMoreTxs() {
  const before = walletTxs.length ? walletTxs[walletTxs.length - 1].block_number : "";
  const q = new URLSearchParams({ limit: "25" });
  if (before) q.set("before", before);
  const res = await api(`/api/v1/wallets/${walletAddr}/transactions?${q}`);
  if (!res.ok) { $("walletTxWrap").innerHTML = `<div class="err">tx query failed: ${esc(res.json?.error)}</div>`; return; }
  walletTxs = walletTxs.concat(res.json.transactions || []);
  renderTxs(res.json.transactions?.length === 25);
}
function renderTxs(more) {
  if (!walletTxs.length) { $("walletTxWrap").innerHTML = `<div class="note">No transactions found in the indexed range.</div>`; return; }
  const rows = walletTxs.map((t) => {
    const dir = t.from_address === walletAddr
      ? `<span class="tag sell">OUT</span>` : `<span class="tag buy">IN</span>`;
    return `<tr><td class="mut">${ts(t.timestamp)}</td><td class="mut">${esc(t.block_number)}</td>
      <td>${dir}</td><td>${addrLink(t.from_address)}</td><td>${addrLink(t.to_address)}</td>
      <td class="num">${amt(t.value, 18)} ETH</td><td>${txLink(t.hash)}</td></tr>`;
  }).join("");
  $("walletTxWrap").innerHTML = `<div class="scroll"><table>
    <thead><tr><th>time</th><th>block</th><th>dir</th><th>from</th><th>to</th><th class="num">value</th><th>tx</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="row" style="margin-top:10px"><span class="note">${walletTxs.length} loaded</span>
    ${more ? `<button class="ghost" id="moreBtn">Load more</button>` : `<span class="note">— end —</span>`}</div>`;
  if (more) $("moreBtn").onclick = () => { $("moreBtn").disabled = true; loadMoreTxs(); };
}

/* ---- token lookup ---- */
async function lookupToken() {
  const addr = $("tokenInput").value.trim().toLowerCase();
  if (!/^0x[0-9a-f]{40}$/.test(addr)) { $("tokenResult").innerHTML = `<div class="err">Not a valid 0x address.</div>`; return; }
  $("tokenBtn").disabled = true;
  $("tokenResult").innerHTML = `<div class="note">loading…</div>`;
  const res = await api(`/api/v1/tokens/${addr}`);
  if (res.ok) {
    const r = res.json;
    const pending = r.price == null;
    $("tokenResult").innerHTML = `<dl class="kv">
      <dt>symbol</dt><dd>${esc(r.symbol ?? "—")} ${esc(r.name ? "· " + r.name : "")}</dd>
      <dt>type</dt><dd>${esc(r.token_type ?? "—")} · decimals ${esc(r.decimals ?? "—")} ${r.verified ? "· verified" : ""}</dd>
      <dt>price</dt><dd>${confPrice(r.price, r.price_confidence)} ${r.price_confidence ? `<span class="mut">(${esc(r.price_confidence)} confidence)</span>` : ""}</dd>
      <dt>price Ξ</dt><dd>${r.price_native ? Number(r.price_native).toPrecision(6) + " WETH" : "—"}</dd>
      <dt>FDV</dt><dd>${usd(r.fdv)}</dd>
      <dt>market cap</dt><dd>${usd(r.market_cap)} <span class="mut">(= FDV; no circulating-supply feed)</span></dd>
      <dt>liquidity</dt><dd>${usd(r.liquidity_usd)}</dd>
      <dt>volume</dt><dd>24h ${usd(r.volume_24h)} · 6h ${usd(r.volume_6h)} · 1h ${usd(r.volume_1h)}</dd>
      <dt>24h buys / sells</dt><dd>${esc(r.buy_count_24h ?? 0)} / ${esc(r.sell_count_24h ?? 0)}</dd>
      <dt>pools</dt><dd>${esc(r.pool_count ?? 0)}</dd>
      <dt>total supply</dt><dd>${r.total_supply ? amt(r.total_supply, r.decimals) : "—"}</dd>
      <dt>address</dt><dd>${addrLink(r.address)}</dd>
    </dl>${pending ? `<div class="note">Stats not computed yet — the worker runs every ~45s (and only prices tokens with pooled liquidity).</div>` : ""}`;
  } else if (res.status === 404) {
    $("tokenResult").innerHTML = `<div class="note">Not found — <code>${esc(res.json?.error)}</code>.</div>`;
  } else {
    $("tokenResult").innerHTML = `<div class="err">${esc(res.json?.error || res.status)}</div>`;
  }
  $("tokenBtn").disabled = false;
}

/* ---- wiring ---- */
$("walletBtn").onclick = lookupWallet;
$("walletInput").addEventListener("keydown", (e) => { if (e.key === "Enter") lookupWallet(); });
$("tokenBtn").onclick = lookupToken;
$("tokenInput").addEventListener("keydown", (e) => { if (e.key === "Enter") lookupToken(); });

async function refresh() {
  await pollHealth();
  await Promise.all([loadMarket(), loadTokens(), loadPairs(), loadSwaps()]);
}
refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
